<text x="390" y="440" text-anchor="end" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#111">ESP-NOW ACK ≥ 80%</text>
<text x="390" y="483" text-anchor="end" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#111">3 consecutive windows</text>
<text x="390" y="526" text-anchor="end" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#111">of 5 s each</text>
<text x="1210" y="418" text-anchor="start" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#111">ESP-NOW loss ≥ 30%</text>
