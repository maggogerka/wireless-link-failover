<text x="800" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#111">On every entry: stabilization</text>
<text x="800" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#111">3 windows without switching</text>
<rect x="530" y="610" width="540" height="150" fill="white" stroke="#222" stroke-width="2.5"/>
<text x="800" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#111">UDP</text>
<text x="800" y="703" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#111">Backup through access point</text>
<text x="800" y="744" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="400" fill="#111">ESP-NOW probes every 940 ms</text>
