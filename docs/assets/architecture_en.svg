<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Experimental testbed</title>
  <desc id="desc">One hardware pair is active in each controlled cycle</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow-primary" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#1f5a94"/></marker>
    <marker id="arrow-reserve" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#a34b12"/></marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#5b5b5b"/></marker>
  </defs>
  <text x="80" y="70" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#111111" >Experimental testbed</text>
<text x="80" y="112" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#5b5b5b" >One hardware pair is active in each controlled cycle</text>
<rect x="120" y="190" width="460" height="150" fill="#fff" stroke="#111111" stroke-width="3"/>
<rect x="1020" y="190" width="460" height="150" fill="#fff" stroke="#111111" stroke-width="3"/>
<text x="350" y="250" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#111111" >Active sender</text>
<text x="350" y="294" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#5b5b5b" >ESP8266 / ESP32 / ESP32-S3</text>
<text x="1250" y="250" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#111111" >Receiver</text>
<text x="1250" y="294" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#5b5b5b" >ESP8266 / ESP32 / ESP32-S3</text>
<line x1="595" y1="235" x2="1005" y2="235" stroke="#1f5a94" stroke-width="6" marker-end="url(#arrow-primary)"/>
<line x1="1005" y1="295" x2="595" y2="295" stroke="#1f5a94" stroke-width="6" marker-end="url(#arrow-primary)"/>
<text x="800" y="205" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#1f5a94" >ESP-NOW: probe and application ACK</text>
<rect x="570" y="440" width="460" height="125" fill="#f6f6f6" stroke="#111111" stroke-width="3"/>
<text x="800" y="493" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#111111" >2.4 GHz access point</text>
<text x="800" y="530" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#5b5b5b" >SSID: Lab-2G   •   channel 6</text>
<path d="M350 340 L650 430" fill="none" stroke="#a34b12" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-reserve)"/>
<path d="M1250 340 L950 430" fill="none" stroke="#a34b12" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#arrow-reserve)"/>
<text x="800" y="398" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#a34b12" >Wi-Fi/UDP: broadcast probe, unicast ACK</text>
<rect x="570" y="680" width="460" height="130" fill="#fff" stroke="#111111" stroke-width="3"/>
<text x="800" y="735" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#111111" >Control computer</text>
<text x="800" y="773" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#5b5b5b" >Python GUI + experiment logger</text>
<path d="M350 340 L350 745 L555 745" fill="none" stroke="#5b5b5b" stroke-width="4" marker-end="url(#arrow-gray)"/>
<path d="M1250 340 L1250 745 L1045 745" fill="none" stroke="#5b5b5b" stroke-width="4" marker-end="url(#arrow-gray)"/>
<text x="800" y="635" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#5b5b5b" >USB Serial: commands and JSONL telemetry</text>
<rect x="120" y="875" width="1360" height="70" fill="#f6f6f6" stroke="#e6e6e6" stroke-width="2"/>
<text x="800" y="920" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" fill="#111111" >Tested pairs: ESP8266–ESP32; ESP8266–ESP32-S3; ESP32–ESP32-S3</text>
</svg>