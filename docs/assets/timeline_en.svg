<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Standardized controlled-failure cycle</title>
  <desc id="desc">Log: commands, windows, sequence, CRC32, transport state and application ACKs</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <marker id="arrow-primary" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#1f5a94"/></marker>
    <marker id="arrow-reserve" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#a34b12"/></marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 z" fill="#5b5b5b"/></marker>
  </defs>
  <text x="80" y="70" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="start" fill="#111111" >Standardized controlled-failure cycle</text><line x1="130" y1="380" x2="1470" y2="380" stroke="#111111" stroke-width="4" marker-end="url(#arrow-gray)"/><text x="130" y="270" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1f5a94" >ESP-NOW baseline: 843/843 application ACKs</text><line x1="130" y1="350" x2="130" y2="410" stroke="#5b5b5b" stroke-width="5"/><text x="130" y="465" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#5b5b5b" >Preparation</text><text x="130" y="505" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#5b5b5b" >≥ 30 s; ≥ 5 windows</text><line x1="130" y1="415" x2="130" y2="435" stroke="#e6e6e6" stroke-width="2"/><line x1="520" y1="350" x2="520" y2="410" stroke="#8e2e2e" stroke-width="5"/><text x="520" y="560" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#8e2e2e" >ACK OFF</text><text x="520" y="600" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#5b5b5b" >suppress ESP-NOW ACK</text><line x1="520" y1="415" x2="520" y2="530" stroke="#e6e6e6" stroke-width="2"/><line x1="790" y1="350" x2="790" y2="410" stroke="#a34b12" stroke-width="5"/><text x="790" y="465" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#a34b12" >Fallback to UDP</text><text x="790" y="505" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#5b5b5b" >6.7–11.5 s</text><line x1="790" y1="415" x2="790" y2="435" stroke="#e6e6e6" stroke-width="2"/><line x1="1080" y1="350" x2="1080" y2="410" stroke="#2f6b3b" stroke-width="5"/><text x="1080" y="560" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#2f6b3b" >ACK ON</text><text x="1080" y="600" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#5b5b5b" >restore acknowledgements</text><line x1="1080" y1="415" x2="1080" y2="530" stroke="#e6e6e6" stroke-width="2"/><line x1="1360" y1="350" x2="1360" y2="410" stroke="#1f5a94" stroke-width="5"/><text x="1360" y="465" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#1f5a94" >Return to ESP-NOW</text><text x="1360" y="505" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#5b5b5b" >13.8–18.4 s</text><line x1="1360" y1="415" x2="1360" y2="435" stroke="#e6e6e6" stroke-width="2"/><rect x="150" y="700" width="1300" height="85" fill="#f6f6f6" stroke="#e6e6e6" stroke-width="2"/><text x="800" y="753" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="middle" fill="#111111" >Log: commands, windows, sequence, CRC32, transport state and application ACKs</text>
</svg>