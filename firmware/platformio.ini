[platformio]
default_envs = node8266, node32, node32s3

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
    -D WLF_DIAGNOSTIC_BUILD=1

[env:node8266]
platform = espressif8266@4.2.1
board = nodemcuv2

[env:node32]
platform = espressif32@8.0.0
board = esp32dev
upload_speed = 57600
# На данной CP210x-плате DTR/RTS не переводят GPIO0 в Download Mode.
# Пользователь включает загрузчик кнопками BOOT+RST, поэтому дополнительный
# программный reset перед записью запрещён.
board_upload.before_reset = no-reset

[env:node32s3]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${env.build_flags}
    -D BOARD_HAS_PSRAM
    # Оставляем native USB доступным как последовательный порт после прошивки.
    -D ARDUINO_USB_CDC_ON_BOOT=1

