[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-link-failover-console"
version = "0.1.0"
description = "Desktop console for the Wireless Link Failover experiments"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4",
]

[project.scripts]
wlf-console = "wlf_console.app:main"

[tool.setuptools.packages.find]
where = ["src"]

