<text x="40.0" y="680.0" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="600" fill="#166534">Во всех парах переход и возврат состоялись в 5 из 5 циклов; горизонтальная черта — среднее.</text>
<text x="40.0" y="711.0" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="600" fill="#B45309">Низкая UDP-доставка 32–S3 (68,5 %) не помешала восстановлению ESP-NOW, но требует отдельного исследования UDP.</text>
<text x="40.0" y="739.0" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280">Серия 8266–S3 имеет документированное отклонение времени подготовки; настройки и три стабилизационных окна совпадали.</text>
<text x="1398.0" y="778.0" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280">Wireless Link Failover · 09.11.2026</text>
